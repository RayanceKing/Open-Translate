<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <main class="welcome">
        <img class="app-icon" src="../Icon.png" alt="Open Translate">
        <h1>Open Translate</h1>
        <p class="platform-ios">请在 Safari 扩展设置中启用 Open Translate，然后返回 Safari 使用翻译功能。</p>
        <p class="platform-mac state-unknown">请在 Safari 扩展设置中启用 Open Translate。</p>
        <p class="platform-mac state-on">Open Translate 已启用，可以返回 Safari 使用翻译功能。</p>
        <p class="platform-mac state-off">Open Translate 当前未启用，请在 Safari 扩展设置中打开它。</p>
        <button class="platform-ios open-settings">打开 Safari 扩展设置…</button>
        <button class="platform-mac open-preferences">打开 Safari 扩展设置…</button>
        <p class="hint">启用后，打开任意网页即可翻译文章、字幕和选中文本。</p>
    </main>
</body>
</html>
