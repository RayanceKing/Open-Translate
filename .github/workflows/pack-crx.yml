name: Pack CRX & XPI

# 推送 main / 打 tag 时，从同一份 extension/ 源码产出：
#   - Chrome / Edge : .crx（带签名）+ .zip
#   - Firefox       : .xpi（未签名）+ .zip，Firefox manifest 由 scripts/build-firefox.mjs 生成
#   - 油猴脚本      : open-translate.user.js
# 打 tag 且配置了 AMO JWT 凭证时，额外用 web-ext sign 产出 -firefox-signed.xpi（可直装正式版 Firefox）；
# 凭证未配置或签名失败时跳过，其余产物照常发布，不会让构建失败。
# 全部产物进 Actions Artifacts；打 tag 时还会作为资源挂到同名 GitHub Release。

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时创建 Release 并上传资源需要写权限

concurrency:
  group: pack-crx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Build CRX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22' # crx3@2 要求 node >= 22

      - name: Read manifest version
        id: meta
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
            if (m.manifest_version !== 3) throw new Error("manifest_version 必须是 3");
            if (!/^(\d+\.){0,3}\d+$/.test(m.version)) throw new Error("版本号不合法: " + m.version);
            for (const p of m.version.split(".")) if (+p > 65535) throw new Error("版本号每段不能超过 65535");
            console.log("version=" + m.version);
            console.log("name=" + m.name);
          ' >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          NORMALIZED="${TAG#v}"
          if printf '%s' "$NORMALIZED" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}$'; then
            if [ "$NORMALIZED" != "$VERSION" ]; then
              echo "::error title=版本不一致::tag ${TAG} 对应 ${NORMALIZED}，但 manifest.json 里是 ${VERSION}"
              exit 1
            fi
            echo "tag $TAG 与 manifest 版本 $VERSION 一致"
          else
            echo "::notice title=跳过版本校验::tag $TAG 不是版本号形式，跳过一致性校验"
          fi

      - name: Validate extension
        run: |
          set -euo pipefail
          for f in manifest.json background.js content.js content.css popup.html popup.js options.html options.js; do
            [ -f "extension/$f" ] || { echo "::error::缺少 extension/$f"; exit 1; }
          done
          # 语法检查：复制成 .mjs 让 Node 按 ES module 解析（lib/*.js 是 module，直接 --check 会被当 CJS 误报）
          while IFS= read -r f; do
            cp "$f" /tmp/check.mjs
            node --check /tmp/check.mjs || { echo "::error::语法错误: $f"; exit 1; }
          done < <(find extension -name '*.js')
          # 清掉不该进包的杂物
          find extension -name '.DS_Store' -delete
          find extension -name '*.pem' -delete
          echo "extension/ 校验通过"

      - name: Prepare signing key
        id: key
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${CRX_PRIVATE_KEY:-}" ]; then
            node -e '
              const fs = require("fs");
              fs.writeFileSync("key.pem", Buffer.from(process.env.CRX_PRIVATE_KEY, "base64"), { mode: 0o600 });
            '
            echo "source=secret" >> "$GITHUB_OUTPUT"
          else
            openssl genrsa -out key.pem 2048 2>/dev/null
            chmod 600 key.pem
            echo "source=generated" >> "$GITHUB_OUTPUT"
            echo "::warning title=未配置签名密钥::仓库 Secrets 里没有 CRX_PRIVATE_KEY，本次用临时密钥签名，扩展 ID 每次运行都会变。"
          fi
          # secret 贴错格式（例如贴了 PEM 原文而不是 base64）时给出可读的报错
          if ! openssl rsa -in key.pem -check -noout >/dev/null 2>&1; then
            echo "::error title=密钥不可用::CRX_PRIVATE_KEY 解出来不是有效的 RSA 私钥，请确认存的是 PEM 文件的 base64（base64 -i key.pem 的输出），而不是 PEM 原文。"
            exit 1
          fi
          # 扩展 ID = sha256(DER 公钥) 前 16 字节，每个十六进制位 0-f 映射到 a-p
          ID=$(node -e '
            const crypto = require("crypto");
            const der = require("child_process").execFileSync("openssl", ["rsa", "-in", "key.pem", "-pubout", "-outform", "DER"], { stdio: ["ignore", "pipe", "ignore"] });
            const hex = crypto.createHash("sha256").update(der).digest("hex").slice(0, 32);
            console.log(hex.replace(/[0-9a-f]/g, ch => String.fromCharCode(97 + parseInt(ch, 16))));
          ')
          echo "ext_id=$ID" >> "$GITHUB_OUTPUT"
          echo "扩展 ID: $ID"

      - name: Pack CRX and ZIP
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          EXPECT: ${{ steps.key.outputs.ext_id }}
        run: |
          set -euo pipefail
          BASE="open-translate-${VERSION}"
          mkdir -p dist
          npx --yes crx3@2.0.0 -p key.pem -o "dist/$BASE.crx" -z "dist/$BASE.zip" extension

          # 自检：魔数 / 头部长度 / crx_id 是否与密钥推导出的扩展 ID 一致 / 内嵌 zip 是否完好
          BASE="$BASE" node -e '
            const fs = require("fs");
            const b = fs.readFileSync("dist/" + process.env.BASE + ".crx");
            if (b.subarray(0, 4).toString("latin1") !== "Cr24") throw new Error("不是 CRX 魔数");
            if (b.readUInt32LE(4) !== 3) throw new Error("不是 CRX3");
            const hlen = b.readUInt32LE(8);
            const zip = b.subarray(12 + hlen);
            if (zip.subarray(0, 2).toString("latin1") !== "PK") throw new Error("内嵌 zip 损坏");
            // 从 protobuf 头部里取出 signed_header_data.crx_id 比对
            const readVarint = (buf, p) => { let r = 0, s = 0, x; do { x = buf[p++]; r += (x & 0x7f) * 2 ** s; s += 7; } while (x & 0x80); return [r, p]; };
            const header = b.subarray(12, 12 + hlen);
            let p = 0, shd = null;
            while (p < header.length) {
              let tag; [tag, p] = readVarint(header, p);
              let len; [len, p] = readVarint(header, p);
              if (tag >> 3 === 10000) shd = header.subarray(p, p + len);
              p += len;
            }
            let q = 0, id = null;
            while (q < shd.length) {
              let tag; [tag, q] = readVarint(shd, q);
              let len; [len, q] = readVarint(shd, q);
              if (tag >> 3 === 1) id = shd.subarray(q, q + len);
              q += len;
            }
            const got = id.toString("hex").replace(/[0-9a-f]/g, ch => String.fromCharCode(97 + parseInt(ch, 16)));
            if (got !== process.env.EXPECT) throw new Error("扩展 ID 不匹配: " + got + " != " + process.env.EXPECT);
            console.log("CRX3 自检通过，扩展 ID " + got + "，载荷 " + zip.length + " 字节");
          '

          # 显式列出 Chrome 产物，避免后续 Firefox 产物被通配符误算进来
          ( cd dist && sha256sum "$BASE.crx" "$BASE.zip" | tee SHA256SUMS.txt )

      - name: Include userscript
        run: |
          set -euo pipefail
          cp tampermonkey/open-translate.user.js "dist/open-translate.user.js"
          # 油猴脚本是独立产物（Tampermonkey / 用户脚本管理器），不进 CRX/ZIP，单独作为 Release 资源发布
          node --check tampermonkey/open-translate.user.js || { echo "::error::open-translate.user.js 语法错误"; exit 1; }
          ( cd dist && sha256sum open-translate.user.js >> SHA256SUMS.txt )
          echo "已附带 open-translate.user.js 到 dist/"

      - name: Pack Firefox XPI and ZIP
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # 同一份源码，换成 Firefox MV3 manifest（background.scripts + gecko 设置）后打包。
          # 脚本自带 zip 完整性、条目清单、manifest 字段自检。
          node scripts/build-firefox.mjs
          ( cd dist && sha256sum "open-translate-${VERSION}-firefox.xpi" "open-translate-${VERSION}-firefox.zip" >> SHA256SUMS.txt )
          echo "Firefox 产物已加入 SHA256SUMS.txt"

      - name: Sign Firefox XPI with AMO
        id: amo
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          # AMO 开发者后台的字段名是 JWT Issuer / JWT Secret；这里同时兼容官方拼写 AMO_JWT_ISSUER。
          AMO_JWT_ISSUE: ${{ secrets.AMO_JWT_ISSUE || secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          # 签名是可选的发布增强：缺凭证、AMO 报错、结果异常都不阻断其余产物发布。
          finish() {
            echo "signed=$1" >> "$GITHUB_OUTPUT"
            echo "note=$2" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -z "${AMO_JWT_ISSUE:-}" ] || [ -z "${AMO_JWT_SECRET:-}" ]; then
            echo "::notice title=跳过 AMO 签名::仓库 Secrets 里没有 AMO_JWT_ISSUE / AMO_JWT_SECRET，本次只发布未签名的 Firefox XPI。"
            finish false "凭证未配置，跳过签名（仅发布未签名 XPI）"
          fi

          # web-ext sign 只接受解包目录，从本轮生成的 XPI 还原，保证签的与发布的是同一份 manifest
          # （含 gecko id 与 data_collection_permissions）。
          WORK="$(mktemp -d)"
          trap 'if [ -n "${WORK:-}" ]; then rm -rf -- "$WORK"; fi' EXIT
          mkdir -p "$WORK/source" "$WORK/artifacts"
          unzip -q "dist/open-translate-${VERSION}-firefox.xpi" -d "$WORK/source"

          # unlisted = 不进 AMO 商店列表，只取回可自行分发的签名包；要上架公开列表改成 listed。
          # 凭证只在运行时由 env 传入，workflow 文件里不存明文，日志里 GitHub 会自动 mask。
          if ! npx --yes web-ext@8 sign \
            --source-dir "$WORK/source" \
            --artifacts-dir "$WORK/artifacts" \
            --api-key "$AMO_JWT_ISSUE" \
            --api-secret "$AMO_JWT_SECRET" \
            --channel unlisted \
            --timeout 900000 \
            --no-input; then
            echo "::warning title=AMO 签名失败::不阻断发布，本次仍会上传未签名的 Firefox XPI。"
            finish false "AMO 签名失败（详见本步骤日志），已保留未签名 XPI"
          fi

          SIGNED="$(find "$WORK/artifacts" -type f -name '*.xpi' -print -quit)"
          ENTRIES=""
          if [ -n "$SIGNED" ]; then ENTRIES="$(unzip -Z1 "$SIGNED" 2>/dev/null || true)"; fi
          # AMO 签过的包必带 META-INF 签名块；没有就说明拿到的仍是未签名构建产物。
          case "$ENTRIES" in
            *"META-INF/"*) ;;
            *)
              echo "::warning title=签名结果异常::未找到带 META-INF 的已签名 XPI，跳过发布签名包。"
              finish false "签名结果异常（缺少 META-INF），已保留未签名 XPI"
              ;;
          esac

          TARGET="open-translate-${VERSION}-firefox-signed.xpi"
          cp "$SIGNED" "dist/$TARGET"
          unzip -t "dist/$TARGET" >/dev/null
          ( cd dist && sha256sum "$TARGET" >> SHA256SUMS.txt )
          echo "AMO 签名完成：${TARGET}"
          echo "dist/*.xpi 会一并上传，SHA256SUMS.txt 已追加该文件的校验和。"
          finish true "已签名（unlisted 渠道），可直接安装到正式版 Firefox"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-translate-${{ steps.meta.outputs.version }}-crx
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          EXT_ID: ${{ steps.key.outputs.ext_id }}
          KEY_SOURCE: ${{ steps.key.outputs.source }}
          COMMIT: ${{ github.sha }}
          AMO_NOTE: ${{ steps.amo.outputs.note }}
        run: |
          set -euo pipefail
          AMO_NOTE="${AMO_NOTE:-未执行签名（仅 tag 构建触发）}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，追加/覆盖资源"
            gh release upload "$TAG" dist/*.crx dist/*.zip dist/*.xpi dist/SHA256SUMS.txt dist/open-translate.user.js --clobber
          else
            NOTES="Open-Translate v$VERSION
            扩展 ID: $EXT_ID
            签名密钥来源: $KEY_SOURCE
            Firefox AMO 签名: $AMO_NOTE
            提交: $COMMIT
            下载:
            - .crx 签名安装包（Chrome 对非商店来源 .crx 有策略限制，装不上时请用 .zip）
            - .zip 开发者模式解压加载 / 上架用
            - *-firefox-signed.xpi AMO 签名版（配置了 JWT 凭证后才有，可直接安装到正式版 Firefox）
            - *-firefox.xpi / *-firefox.zip 未签名 Firefox 扩展（about:debugging 临时加载）
            - open-translate.user.js 油猴脚本（Firefox / 篡改猴 / Violentmonkey，免应用商店）
            - SHA256SUMS.txt 校验和"
            gh release create "$TAG" dist/*.crx dist/*.zip dist/*.xpi dist/SHA256SUMS.txt dist/open-translate.user.js \
              --title "Open-Translate v$VERSION" \
              --notes "$NOTES"
          fi

      - name: Summary
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          EXT_ID: ${{ steps.key.outputs.ext_id }}
          KEY_SOURCE: ${{ steps.key.outputs.source }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          AMO_SIGNED: ${{ steps.amo.outputs.signed }}
          AMO_NOTE: ${{ steps.amo.outputs.note }}
        run: |
          # 所有值都走 env：Action 表达式占位符会在交给 shell 之前先做文本替换；
          # 若直接把变量内联进脚本，值里的反引号 / $() 会被 shell 当成命令执行（tag 名允许带反引号），所以这里统一用 env 注入。
          AMO_NOTE="${AMO_NOTE:-未执行（仅 tag 构建触发 AMO 签名）}"
          AMO_SIGNED="${AMO_SIGNED:-false}"
          if [ "$KEY_SOURCE" = "secret" ]; then
            KEY_NOTE="仓库 Secret CRX_PRIVATE_KEY"
          else
            KEY_NOTE="**临时生成**（扩展 ID 每次都会变，建议配置 Secret）"
          fi
          {
            echo "### ${NAME} v${VERSION}"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`${VERSION}\` |"
            echo "| 扩展 ID | \`${EXT_ID}\` |"
            echo "| 签名密钥 | ${KEY_NOTE} |"
            echo "| Firefox AMO 签名 | ${AMO_NOTE} |"
            echo "| 触发 | ${REF_TYPE} ${REF_NAME} |"
            echo "| 提交 | \`${COMMIT}\` |"
            echo ""
            echo "产物：\`.crx\` + \`.zip\`（Chrome / Edge）、\`*-firefox.xpi\` + \`*-firefox.zip\`（Firefox MV3，未签名）、\`*-firefox-signed.xpi\`（AMO 签名版，有凭证时才有）、\`open-translate.user.js\`（油猴脚本）、\`SHA256SUMS.txt\`。"
            echo "Chrome 对非商店来源的 .crx 有策略限制，装不上时解压 .zip 用「加载已解压的扩展程序」。"
            if [ "$AMO_SIGNED" = "true" ]; then
              echo "Firefox：优先用 \`*-firefox-signed.xpi\`（AMO 已签名，正式版 Firefox 可直接安装）；未签名的 \`-firefox.xpi\` / \`-firefox.zip\` 仅供 about:debugging 临时加载。"
            else
              echo "Firefox 的 .xpi 未签名，请用 about:debugging 的「临时加载附加组件」；配置仓库 Secrets \`AMO_JWT_ISSUE\` / \`AMO_JWT_SECRET\` 后，打 tag 会自动产出可直装的签名版。"
            fi
            echo ""
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private key
        if: always()
        run: rm -f key.pem
